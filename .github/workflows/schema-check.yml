# Purpose: Validate public fixtures against their JSON schemas.
# Trigger: Triggered on pushes and pull requests.
# Security: Use local fixtures and read-only repository access; do not access private backend data.
name: schema-check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:schema
