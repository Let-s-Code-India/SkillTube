# Purpose: Run generators and public link, responsive, Worker, and security checks.
# Trigger: Triggered on pushes and pull requests.
# Security: Use local fixtures and read-only repository access; do not use production secrets.
name: link-check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:posts
      - run: npm run check:docs
      - run: npm run check:links
      - run: npm run check:responsive
      - run: npm run check:worker
      - run: npm run check:security
      - run: node tools/stamp-footer.mjs --check
