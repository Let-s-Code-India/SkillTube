name: link-check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:posts
      - run: npm run check:links
      - run: npm run check:worker
      - run: node tools/stamp-footer.mjs --check
