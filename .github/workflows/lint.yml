name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Reject inline scripts and handlers
        run: |
          if grep -RInE '<script>|<script[[:space:]]+[^>]*type="text/javascript"|style="| onclick=' public --include='*.html'; then exit 1; fi
      - name: Check common footer
        run: node tools/stamp-footer.mjs --check
